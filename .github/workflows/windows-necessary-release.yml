name: Windows Necessary public release

on:
  workflow_dispatch:
    inputs:
      submit-for-signing:
        description: Sign the verified MSI after Necessary has approved Vincent and issued a token
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  LVRS_COMMIT: 07efeb4490304b08454d645001c186e89735bb53
  IIPAINTENGINE_COMMIT: 83a199fbdc827b92ce346f42db0e33d85a520a1e
  OSSLSIGNCODE_VERSION: '2.14'
  OSSLSIGNCODE_WINDOWS_SHA256: 9a1722aaf62a27852c4eb9c35749a0248065052d0ae0a93d4ed6bb49def027f2
  VINCENT_TIMESTAMP_URL: http://timestamp.digicert.com

jobs:
  build-and-sign:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Check out Vincent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Require a tag for a signing request
        if: ${{ inputs.submit-for-signing }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne "tag") {
              throw "Necessary release signing must run from an immutable Git tag."
          }

      - name: Require Necessary signing configuration
        if: ${{ inputs.submit-for-signing }}
        shell: pwsh
        env:
          NECESSARY_SIGN_TOKEN: '${{ secrets.NECESSARY_SIGN_TOKEN }}'
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NECESSARY_SIGN_TOKEN)) {
              throw "Required Necessary signing secret is missing: NECESSARY_SIGN_TOKEN"
          }

      - name: Install Qt 6.8.3 and the matching MinGW toolchain
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtimageformats qtshadertools'
          source: true
          src-archives: 'qtbase qtdeclarative qtsvg qtimageformats qtshadertools qttranslations'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          cache: true

      - name: Install WiX Toolset 3.14.1
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1.20250415 --yes --no-progress
          $wixTools = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path -LiteralPath (Join-Path $wixTools "light.exe"))) {
              throw "WiX Toolset 3.14 was not installed at the expected path."
          }
          "WIX_TOOLS_DIR=$wixTools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out pinned framework sources
        shell: pwsh
        run: |
          $lvrsSource = Join-Path $env:RUNNER_WORKSPACE "LVRS"
          $engineSource = Join-Path $env:RUNNER_WORKSPACE "iiPaintEngine"
          git clone --filter=blob:none https://github.com/iisacc-Justmoong/LVRS.git $lvrsSource
          git -C $lvrsSource checkout --detach $env:LVRS_COMMIT
          git clone --filter=blob:none https://github.com/iisacc-Justmoong/iiPaintEngine.git $engineSource
          git -C $engineSource checkout --detach $env:IIPAINTENGINE_COMMIT

      - name: Build and install pinned LVRS
        shell: pwsh
        run: |
          $lvrsSource = Join-Path $env:RUNNER_WORKSPACE "LVRS"
          $lvrsPrefix = Join-Path $env:USERPROFILE ".local\SDK\LVRS"
          $env:LVRS_BOOTSTRAP_QT_PREFIX_WINDOWS = $env:QT_ROOT_DIR
          $env:LVRS_BOOTSTRAP_FRAMEWORK_PLATFORMS = "windows"
          $lvrsArguments = @(
              "--platforms", "windows",
              "--prefix", $lvrsPrefix,
              "--build-type", "MinSizeRel",
              "--without-examples",
              "--without-tests",
              "--",
              "-DLVRS_ENABLE_IPO=OFF",
              "-DLVRS_BOOTSTRAP_LVRS_ENABLE_IPO=OFF",
              "-DLVRS_ENABLE_PLATFORM_BUILD_OPTIMIZATIONS=OFF",
              "-DLVRS_BOOTSTRAP_LVRS_ENABLE_PLATFORM_BUILD_OPTIMIZATIONS=OFF"
          )
          & (Join-Path $lvrsSource "install.ps1") @lvrsArguments
          if ($LASTEXITCODE -ne 0) { throw "LVRS installation failed." }
          "LVRS_PREFIX=$lvrsPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and install pinned iiPaintEngine
        shell: pwsh
        run: |
          $engineSource = Join-Path $env:RUNNER_WORKSPACE "iiPaintEngine"
          $enginePrefix = Join-Path $env:USERPROFILE ".local\SDK\iiPaintEngine"
          $env:IIPAINTENGINE_PREFIX = $enginePrefix
          $env:IIPAINTENGINE_INSTALL_PLATFORMS = "windows"
          $env:IIPAINTENGINE_WINDOWS_QT_PREFIX = $env:QT_ROOT_DIR
          $env:IIPAINTENGINE_LVRS_PREFIX = $env:LVRS_PREFIX
          $env:IIPAINTENGINE_SKIP_TESTS = "ON"
          & (Join-Path $engineSource "install.ps1")
          if ($LASTEXITCODE -ne 0) { throw "iiPaintEngine installation failed." }
          "IIPAINTENGINE_PREFIX=$enginePrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify osslsigncode 2.14
        if: ${{ inputs.submit-for-signing }}
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:GITHUB_WORKSPACE "build\tools\osslsigncode"
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          $archivePath = Join-Path $toolRoot "osslsigncode-$env:OSSLSIGNCODE_VERSION-windows-x64-mingw.zip"
          $archiveUrl = "https://github.com/mtrojnar/osslsigncode/releases/download/2.14/osslsigncode-2.14-windows-x64-mingw.zip"
          Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath -UseBasicParsing
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $env:OSSLSIGNCODE_WINDOWS_SHA256) {
              throw "The pinned osslsigncode archive SHA-256 does not match."
          }
          $expandedPath = Join-Path $toolRoot "expanded"
          Expand-Archive -LiteralPath $archivePath -DestinationPath $expandedPath -Force
          $candidates = @(Get-ChildItem -LiteralPath $expandedPath -Filter "osslsigncode.exe" -Recurse -File)
          if ($candidates.Count -ne 1) {
              throw "The pinned osslsigncode archive must contain exactly one executable."
          }
          & $candidates[0].FullName --version
          if ($LASTEXITCODE -ne 0) { throw "The pinned osslsigncode executable did not start." }
          "OSSLSIGNCODE_PATH=$($candidates[0].FullName)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate Windows SDK SignTool
        if: ${{ inputs.submit-for-signing }}
        shell: pwsh
        run: |
          $windowsKitsBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signToolCandidates = @(
              Get-ChildItem -LiteralPath $windowsKitsBin -Filter "signtool.exe" -Recurse -File |
                  Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
                  Sort-Object -Property FullName -Descending
          )
          if ($signToolCandidates.Count -lt 1) {
              throw "Windows SDK SignTool was not found on the GitHub-hosted runner."
          }
          "SIGNTOOL_PATH=$($signToolCandidates[0].FullName)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build verified MSI input
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ vars.VINCENT_CORRESPONDING_SOURCE_URL }}") -or
              [string]::IsNullOrWhiteSpace("${{ vars.VINCENT_CORRESPONDING_SOURCE_SHA256 }}")) {
              throw "Configure the public corresponding-source URL and SHA-256 repository variables."
          }
          $env:QT_PREFIX = $env:QT_ROOT_DIR
          $env:VINCENT_CORRESPONDING_SOURCE_URL = "${{ vars.VINCENT_CORRESPONDING_SOURCE_URL }}"
          $env:VINCENT_CORRESPONDING_SOURCE_SHA256 = "${{ vars.VINCENT_CORRESPONDING_SOURCE_SHA256 }}"
          .\build-windows.ps1 -BuildType Release -ExternalSigning -SkipPackage -CreateMsi

      - name: Require the matching version tag
        if: ${{ inputs.submit-for-signing }}
        shell: pwsh
        run: |
          $cmakeCache = Join-Path $env:GITHUB_WORKSPACE "build\CMakeCache.txt"
          $versionEntries = @(Get-Content -LiteralPath $cmakeCache |
              Where-Object { $_ -match '^CMAKE_PROJECT_VERSION:STATIC=' })
          if ($versionEntries.Count -ne 1) {
              throw "The configured Vincent project version was not found exactly once in CMakeCache.txt."
          }
          $expectedVersion = ($versionEntries[0] -split '=', 2)[1]
          if ($expectedVersion -notmatch '^\d+\.\d+(?:\.\d+)?$') {
              throw "The configured Vincent project version is invalid: $expectedVersion"
          }
          $expectedTag = "v$expectedVersion"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
              throw "The signing tag must match the configured Vincent version: expected $expectedTag, received $($env:GITHUB_REF_NAME)."
          }
          "VINCENT_RELEASE_VERSION=$expectedVersion" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign and verify Necessary release
        if: ${{ inputs.submit-for-signing }}
        shell: pwsh
        env:
          NECESSARY_SIGN_TOKEN: '${{ secrets.NECESSARY_SIGN_TOKEN }}'
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE "tools\necessary-authenticode.ps1")
          . (Join-Path $env:GITHUB_WORKSPACE "tools\necessary-windows-release.ps1")
          $result = Invoke-VincentNecessaryWindowsRelease `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -BuildDirectory (Join-Path $env:GITHUB_WORKSPACE "build") `
              -StageDirectory (Join-Path $env:GITHUB_WORKSPACE "dist\Vincent-Windows") `
              -WixToolsDirectory $env:WIX_TOOLS_DIR `
              -OsslSignCodePath $env:OSSLSIGNCODE_PATH `
              -SignToolPath $env:SIGNTOOL_PATH `
              -SigningToken $env:NECESSARY_SIGN_TOKEN `
              -TimestampUrl $env:VINCENT_TIMESTAMP_URL
          Write-Host "Verified Necessary MSI: $($result.File)"
          Write-Host "SHA-256: $($result.SHA256)"

      - name: Upload the single website release file
        if: ${{ inputs.submit-for-signing }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Vincent-website-release
          path: 'build/Vincent-*-Windows.msi'
          archive: false
          if-no-files-found: error
          retention-days: 30
