name: Windows corresponding source

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LVRS_COMMIT: 8132a48e4c0788f0548bff20fd7089878a09c760
  IIPAINTENGINE_COMMIT: 5ade15e24ce3a7eab25669144fdee668672b22d6
  IISHAREDCANVAS_COMMIT: d2c41bf605725eb07b181587321f0ce910b9924d
  PSD_SDK_COMMIT: f51449543273cbf12058ae92b230e0c4209f5066
  QTKEYCHAIN_COMMIT: 875f77d9f61bd97fd84cca47ce3bc71186dfbd09
  IIUPDATEMANAGER_REPOSITORY: ${{ vars.IIUPDATEMANAGER_REPOSITORY }}
  IIUPDATEMANAGER_COMMIT: ${{ vars.IIUPDATEMANAGER_COMMIT }}
  IILICENSEMANAGER_COMMIT: ${{ vars.IILICENSEMANAGER_COMMIT }}

jobs:
  package-source:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out Vincent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Require pinned iiUpdateManager provenance
        shell: pwsh
        env:
          IIUPDATEMANAGER_READ_TOKEN: ${{ secrets.IIUPDATEMANAGER_READ_TOKEN }}
        run: |
          $repositoryUri = $null
          if (-not [System.Uri]::TryCreate($env:IIUPDATEMANAGER_REPOSITORY, [System.UriKind]::Absolute, [ref]$repositoryUri) -or
              $repositoryUri.Scheme -cne "https" -or
              $repositoryUri.Host -cne "github.com" -or
              $repositoryUri.AbsolutePath -notmatch '^/iisacc-Justmoong/[A-Za-z0-9_.-]+(?:\.git)?$') {
              throw "Configure IIUPDATEMANAGER_REPOSITORY as an iisacc-Justmoong GitHub HTTPS repository."
          }
          if ($env:IIUPDATEMANAGER_COMMIT -notmatch '^[0-9a-fA-F]{40}$') {
              throw "Configure IIUPDATEMANAGER_COMMIT as the reviewed 40-hex commit."
          }
          if ($env:IILICENSEMANAGER_COMMIT -notmatch '^[0-9a-fA-F]{40}$') {
              throw "Configure IILICENSEMANAGER_COMMIT as the reviewed 40-hex commit."
          }
          if ([string]::IsNullOrWhiteSpace($env:IIUPDATEMANAGER_READ_TOKEN)) {
              throw "Configure IIUPDATEMANAGER_READ_TOKEN for the private pinned dependency checkout."
          }

      - name: Check out pinned iiUpdateManager
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: iisacc-Justmoong/iiUpdateManager
          ref: ${{ vars.IIUPDATEMANAGER_COMMIT }}
          token: ${{ secrets.IIUPDATEMANAGER_READ_TOKEN }}
          path: _private/iiUpdateManager
          persist-credentials: false

      - name: Check out pinned iiLicenseManager
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: iisacc-Justmoong/iiLicenseManager
          ref: ${{ vars.IILICENSEMANAGER_COMMIT }}
          token: ${{ secrets.IIUPDATEMANAGER_READ_TOKEN }}
          path: _private/iiLicenseManager
          persist-credentials: false

      - name: Install matching Qt source modules
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtimageformats qtshadertools'
          source: true
          src-archives: 'qtbase qtdeclarative qtsvg qtimageformats qtshadertools qttranslations'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          cache: true

      - name: Check out pinned source dependencies
        shell: pwsh
        run: |
          $lvrsSource = Join-Path $env:RUNNER_WORKSPACE "LVRS"
          $engineSource = Join-Path $env:RUNNER_WORKSPACE "iiPaintEngine"
          $sharedCanvasSource = Join-Path $env:RUNNER_WORKSPACE "iiSharedCanvas"
          $licenseManagerSource = Join-Path $env:GITHUB_WORKSPACE "_private\iiLicenseManager"
          $updateManagerSource = Join-Path $env:GITHUB_WORKSPACE "_private\iiUpdateManager"
          $dependencyRoot = Join-Path $env:GITHUB_WORKSPACE "build\_deps"
          $psdSource = Join-Path $dependencyRoot "psd_sdk-src"
          $qtKeychainSource = Join-Path $dependencyRoot "qtkeychain-src"
          New-Item -ItemType Directory -Path $dependencyRoot -Force | Out-Null

          git clone --filter=blob:none https://github.com/iisacc-Justmoong/LVRS.git $lvrsSource
          git -C $lvrsSource checkout --detach $env:LVRS_COMMIT
          git clone --filter=blob:none https://github.com/iisacc-Justmoong/iiPaintEngine.git $engineSource
          git -C $engineSource checkout --detach $env:IIPAINTENGINE_COMMIT
          git clone --filter=blob:none https://github.com/iisacc-Justmoong/iiSharedCanvas.git $sharedCanvasSource
          git -C $sharedCanvasSource checkout --detach $env:IISHAREDCANVAS_COMMIT
          $resolvedUpdateManagerCommit = (git -C $updateManagerSource rev-parse HEAD).Trim()
          if ($resolvedUpdateManagerCommit -cne $env:IIUPDATEMANAGER_COMMIT.ToLowerInvariant()) {
              throw "iiUpdateManager checkout does not match the pinned commit."
          }
          $resolvedLicenseManagerCommit = (git -C $licenseManagerSource rev-parse HEAD).Trim()
          if ($resolvedLicenseManagerCommit -cne $env:IILICENSEMANAGER_COMMIT.ToLowerInvariant()) {
              throw "iiLicenseManager checkout does not match the pinned commit."
          }
          git clone --filter=blob:none https://github.com/MolecularMatters/psd_sdk.git $psdSource
          git -C $psdSource checkout --detach $env:PSD_SDK_COMMIT
          git clone --filter=blob:none https://github.com/frankosterfeld/qtkeychain.git $qtKeychainSource
          git -C $qtKeychainSource checkout --detach $env:QTKEYCHAIN_COMMIT

      - name: Create and verify corresponding source
        shell: pwsh
        run: |
          $qtSourceRoot = Join-Path (Split-Path -Parent $env:QT_ROOT_DIR) "Src"
          $updateManagerSource = Join-Path $env:GITHUB_WORKSPACE "_private\iiUpdateManager"
          $licenseManagerSource = Join-Path $env:GITHUB_WORKSPACE "_private\iiLicenseManager"
          .\tools\new-corresponding-source.ps1 `
              -Version 6.0 `
              -VincentRevision $env:GITHUB_SHA `
              -IiSharedCanvasRevision $env:IISHAREDCANVAS_COMMIT `
              -IiUpdateManagerSource $updateManagerSource `
              -IiUpdateManagerRevision $env:IIUPDATEMANAGER_COMMIT `
              -IiLicenseManagerSource $licenseManagerSource `
              -IiLicenseManagerRevision $env:IILICENSEMANAGER_COMMIT `
              -QtSourceRoot $qtSourceRoot

      - name: Upload corresponding source and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Vincent-6.0-corresponding-source
          path: |
            build/release-source/Vincent-6.0-Corresponding-Source.zip
            build/release-source/Vincent-6.0-Corresponding-Source.zip.sha256
          if-no-files-found: error
          retention-days: 30
