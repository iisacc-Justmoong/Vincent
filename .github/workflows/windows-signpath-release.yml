name: Windows website release

on:
  workflow_dispatch:
    inputs:
      submit-for-signing:
        description: Submit to SignPath instead of publishing the temporary 2026 unsigned MSI
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  LVRS_COMMIT: 07efeb4490304b08454d645001c186e89735bb53
  IIPAINTENGINE_COMMIT: 83a199fbdc827b92ce346f42db0e33d85a520a1e
  IIUPDATEMANAGER_REPOSITORY: ${{ vars.IIUPDATEMANAGER_REPOSITORY }}
  IIUPDATEMANAGER_COMMIT: ${{ vars.IIUPDATEMANAGER_COMMIT }}

jobs:
  build-and-sign:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out Vincent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Require pinned iiUpdateManager provenance
        shell: pwsh
        run: |
          $repositoryUri = $null
          if (-not [System.Uri]::TryCreate($env:IIUPDATEMANAGER_REPOSITORY, [System.UriKind]::Absolute, [ref]$repositoryUri) -or
              $repositoryUri.Scheme -cne "https" -or
              $repositoryUri.Host -cne "github.com" -or
              $repositoryUri.AbsolutePath -notmatch '^/iisacc-Justmoong/[A-Za-z0-9_.-]+(?:\.git)?$') {
              throw "Configure IIUPDATEMANAGER_REPOSITORY as an iisacc-Justmoong GitHub HTTPS repository."
          }
          if ($env:IIUPDATEMANAGER_COMMIT -notmatch '^[0-9a-fA-F]{40}$') {
              throw "Configure IIUPDATEMANAGER_COMMIT as the reviewed 40-hex commit."
          }

      - name: Require a tag for a signing request
        if: ${{ inputs.submit-for-signing }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne "tag") {
              throw "SignPath release signing must run from an immutable Git tag."
          }

      - name: Require SignPath configuration
        if: ${{ inputs.submit-for-signing }}
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: '${{ secrets.SIGNPATH_API_TOKEN }}'
          SIGNPATH_ORGANIZATION_ID: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          SIGNPATH_PROJECT_SLUG: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          SIGNPATH_SIGNING_POLICY_SLUG: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: '${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}'
        run: |
          $requiredNames = @(
              "SIGNPATH_API_TOKEN",
              "SIGNPATH_ORGANIZATION_ID",
              "SIGNPATH_PROJECT_SLUG",
              "SIGNPATH_SIGNING_POLICY_SLUG",
              "SIGNPATH_ARTIFACT_CONFIGURATION_SLUG"
          )
          foreach ($name in $requiredNames) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if ([string]::IsNullOrWhiteSpace($value)) {
                  throw "Required SignPath secret or repository variable is missing: $name"
              }
          }

      - name: Install Qt 6.8.3 and the matching MinGW toolchain
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtimageformats qtshadertools'
          source: true
          src-archives: 'qtbase qtdeclarative qtsvg qtimageformats qtshadertools qttranslations'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          cache: true

      - name: Install WiX Toolset 3.14.1
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1.20250415 --yes --no-progress
          $wixTools = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path -LiteralPath (Join-Path $wixTools "light.exe"))) {
              throw "WiX Toolset 3.14 was not installed at the expected path."
          }
          "WIX_TOOLS_DIR=$wixTools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out pinned framework sources
        shell: pwsh
        run: |
          $lvrsSource = Join-Path $env:RUNNER_WORKSPACE "LVRS"
          $engineSource = Join-Path $env:RUNNER_WORKSPACE "iiPaintEngine"
          $updateManagerSource = Join-Path $env:RUNNER_WORKSPACE "iiUpdateManager"
          git clone --filter=blob:none https://github.com/iisacc-Justmoong/LVRS.git $lvrsSource
          git -C $lvrsSource checkout --detach $env:LVRS_COMMIT
          git clone --filter=blob:none https://github.com/iisacc-Justmoong/iiPaintEngine.git $engineSource
          git -C $engineSource checkout --detach $env:IIPAINTENGINE_COMMIT
          git clone --filter=blob:none -- $env:IIUPDATEMANAGER_REPOSITORY $updateManagerSource
          git -C $updateManagerSource checkout --detach $env:IIUPDATEMANAGER_COMMIT
          $resolvedUpdateManagerCommit = (git -C $updateManagerSource rev-parse HEAD).Trim()
          if ($resolvedUpdateManagerCommit -cne $env:IIUPDATEMANAGER_COMMIT.ToLowerInvariant()) {
              throw "iiUpdateManager checkout does not match the pinned commit."
          }

      - name: Build and install pinned LVRS
        shell: pwsh
        run: |
          $lvrsSource = Join-Path $env:RUNNER_WORKSPACE "LVRS"
          $lvrsPrefix = Join-Path $env:USERPROFILE ".local\LVRS"
          $env:LVRS_BOOTSTRAP_QT_PREFIX_WINDOWS = $env:QT_ROOT_DIR
          $env:LVRS_BOOTSTRAP_FRAMEWORK_PLATFORMS = "windows"
          $lvrsArguments = @(
              "--platforms", "windows",
              "--prefix", $lvrsPrefix,
              "--build-type", "MinSizeRel",
              "--without-examples",
              "--without-tests",
              "--",
              "-DLVRS_ENABLE_IPO=OFF",
              "-DLVRS_BOOTSTRAP_LVRS_ENABLE_IPO=OFF",
              "-DLVRS_ENABLE_PLATFORM_BUILD_OPTIMIZATIONS=OFF",
              "-DLVRS_BOOTSTRAP_LVRS_ENABLE_PLATFORM_BUILD_OPTIMIZATIONS=OFF"
          )
          & (Join-Path $lvrsSource "install.ps1") @lvrsArguments
          if ($LASTEXITCODE -ne 0) { throw "LVRS installation failed." }
          "LVRS_PREFIX=$lvrsPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and install pinned iiPaintEngine
        shell: pwsh
        run: |
          $engineSource = Join-Path $env:RUNNER_WORKSPACE "iiPaintEngine"
          $enginePrefix = Join-Path $env:USERPROFILE ".local\iiPaintEngine"
          $env:IIPAINTENGINE_PREFIX = $enginePrefix
          $env:IIPAINTENGINE_INSTALL_PLATFORMS = "windows"
          $env:IIPAINTENGINE_WINDOWS_QT_PREFIX = $env:QT_ROOT_DIR
          $env:IIPAINTENGINE_LVRS_PREFIX = $env:LVRS_PREFIX
          $env:IIPAINTENGINE_SKIP_TESTS = "ON"
          & (Join-Path $engineSource "install.ps1")
          if ($LASTEXITCODE -ne 0) { throw "iiPaintEngine installation failed." }
          "IIPAINTENGINE_PREFIX=$enginePrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, test, and install pinned iiUpdateManager
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_WORKSPACE "iiUpdateManager"
          $build = Join-Path $source "build"
          $prefix = Join-Path $env:USERPROFILE ".local\iiUpdateManager"
          cmake -S $source -B $build -G Ninja `
              -DCMAKE_BUILD_TYPE=Release `
              -DBUILD_TESTING=ON `
              "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "iiUpdateManager configure failed." }
          cmake --build $build --parallel
          if ($LASTEXITCODE -ne 0) { throw "iiUpdateManager build failed." }
          ctest --test-dir $build --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "iiUpdateManager tests failed." }
          cmake --install $build --prefix $prefix
          if ($LASTEXITCODE -ne 0) { throw "iiUpdateManager installation failed." }
          "IIUPDATEMANAGER_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build verified Windows MSI
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ vars.VINCENT_CORRESPONDING_SOURCE_URL }}") -or
              [string]::IsNullOrWhiteSpace("${{ vars.VINCENT_CORRESPONDING_SOURCE_SHA256 }}")) {
              throw "Configure the public corresponding-source URL and SHA-256 repository variables."
          }
          $env:QT_PREFIX = $env:QT_ROOT_DIR
          $env:VINCENT_CORRESPONDING_SOURCE_URL = "${{ vars.VINCENT_CORRESPONDING_SOURCE_URL }}"
          $env:VINCENT_CORRESPONDING_SOURCE_SHA256 = "${{ vars.VINCENT_CORRESPONDING_SOURCE_SHA256 }}"
          if ('${{ inputs.submit-for-signing }}' -eq 'true') {
              .\build-windows.ps1 -BuildType Release -ExternalSigning -SkipPackage -CreateMsi
          } else {
              .\build-windows.ps1 -BuildType Release -AllowUnsignedPackage -SkipPackage -CreateMsi
          }

      - name: Require the matching version tag
        if: ${{ inputs.submit-for-signing }}
        shell: pwsh
        run: |
          $cmakeCache = Join-Path $env:GITHUB_WORKSPACE "build\CMakeCache.txt"
          $versionEntries = @(Get-Content -LiteralPath $cmakeCache |
              Where-Object { $_ -match '^CMAKE_PROJECT_VERSION:STATIC=' })
          if ($versionEntries.Count -ne 1) {
              throw "The configured Vincent project version was not found exactly once in CMakeCache.txt."
          }
          $expectedVersion = ($versionEntries[0] -split '=', 2)[1]
          if ($expectedVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw "The configured Vincent project version is invalid: $expectedVersion"
          }
          $expectedTag = "v$expectedVersion"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
              throw "The signing tag must match the configured Vincent version: expected $expectedTag, received $($env:GITHUB_REF_NAME)."
          }

      - name: Upload unsigned SignPath input
        if: ${{ inputs.submit-for-signing }}
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Vincent-SignPath-input
          path: build/signpath-input/Vincent-*-Windows.msi
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload the temporary unsigned website release
        if: ${{ !inputs.submit-for-signing }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Vincent-website-release-unsigned
          path: build/Vincent-*-Windows-unsigned.msi
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Submit signing request
        if: ${{ inputs.submit-for-signing }}
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          artifact-configuration-slug: '${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: '${{ runner.temp }}/signed'

      - name: Verify signed MSI
        if: ${{ inputs.submit-for-signing }}
        shell: pwsh
        run: |
          $signedDirectory = Join-Path $env:RUNNER_TEMP "signed"
          $signedCandidates = @(Get-ChildItem -LiteralPath $signedDirectory -Filter "Vincent-*-Windows.msi" -File)
          if ($signedCandidates.Count -ne 1) {
              throw "SignPath must return exactly one canonical Vincent MSI; found $($signedCandidates.Count)."
          }
          $msi = $signedCandidates[0].FullName
          $signature = Get-AuthenticodeSignature -LiteralPath $msi
          if ($signature.Status -ne "Valid") {
              throw "The SignPath MSI Authenticode signature is not valid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notmatch "SignPath Foundation") {
              throw "The MSI was not signed by the approved SignPath Foundation identity."
          }
          $windowsKitsBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signTool = Get-ChildItem -LiteralPath $windowsKitsBin -Filter "signtool.exe" -Recurse -File |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object -Property FullName -Descending |
              Select-Object -First 1
          if ($null -eq $signTool) {
              throw "Windows SDK SignTool was not found on the GitHub-hosted runner."
          }
          & $signTool.FullName verify /pa /all /tw /v $msi
          if ($LASTEXITCODE -ne 0) { throw "SignTool rejected the signed MSI." }
          $cmakeCache = Join-Path $env:GITHUB_WORKSPACE "build\CMakeCache.txt"
          $versionEntries = @(Get-Content -LiteralPath $cmakeCache |
              Where-Object { $_ -match '^CMAKE_PROJECT_VERSION:STATIC=' })
          if ($versionEntries.Count -ne 1) {
              throw "The configured Vincent project version was not found exactly once in CMakeCache.txt."
          }
          $expectedVersion = ($versionEntries[0] -split '=', 2)[1]
          if ($expectedVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw "The configured Vincent project version is invalid: $expectedVersion"
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\tst_windowsmsidatabasecontract.ps1 -BuildDirectory .\build -Version $expectedVersion -MsiPath $msi
          if ($LASTEXITCODE -ne 0) {
              throw "MSI database contract rejected the signed MSI."
          }

      - name: Extract signed MSI payload for nested signature verification
        if: ${{ inputs.submit-for-signing }}
        shell: pwsh
        run: |
          $signedDirectory = Join-Path $env:RUNNER_TEMP "signed"
          $signedCandidates = @(Get-ChildItem -LiteralPath $signedDirectory -Filter "Vincent-*-Windows.msi" -File)
          if ($signedCandidates.Count -ne 1) {
              throw "SignPath must return exactly one canonical Vincent MSI before nested verification; found $($signedCandidates.Count)."
          }
          $msi = $signedCandidates[0].FullName
          $administrativeImageDirectory = Join-Path $env:RUNNER_TEMP "signed-msi-administrative-image"
          New-Item -ItemType Directory -Path $administrativeImageDirectory -Force | Out-Null
          $msiExecPath = Join-Path $env:SystemRoot "System32\msiexec.exe"
          $msiExecArguments = @(
              "/a",
              "`"$msi`"",
              "/qn",
              "TARGETDIR=`"$administrativeImageDirectory`""
          )
          $msiExecProcess = Start-Process -FilePath $msiExecPath -ArgumentList $msiExecArguments `
              -Wait -PassThru -WindowStyle Hidden
          if ($msiExecProcess.ExitCode -ne 0) {
              throw "Administrative extraction of the signed MSI failed with exit code $($msiExecProcess.ExitCode)."
          }
          $executableCandidates = @(Get-ChildItem -LiteralPath $administrativeImageDirectory `
              -Filter "Vincent.exe" -Recurse -File)
          if ($executableCandidates.Count -ne 1) {
              throw "The signed MSI must install exactly one Vincent.exe; found $($executableCandidates.Count)."
          }
          $executable = $executableCandidates[0].FullName
          $executableSignature = Get-AuthenticodeSignature -LiteralPath $executable
          if ($executableSignature.Status -ne "Valid") {
              throw "The installed Vincent executable is not Authenticode-signed: $($executableSignature.Status)"
          }
          if ($executableSignature.SignerCertificate.Subject -notmatch "SignPath Foundation") {
              throw "The installed Vincent executable was not signed by the approved SignPath Foundation identity."
          }
          $windowsKitsBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signTool = Get-ChildItem -LiteralPath $windowsKitsBin -Filter "signtool.exe" -Recurse -File |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object -Property FullName -Descending |
              Select-Object -First 1
          if ($null -eq $signTool) {
              throw "Windows SDK SignTool was not found on the GitHub-hosted runner."
          }
          & $signTool.FullName verify /pa /all /tw /v $executable
          if ($LASTEXITCODE -ne 0) {
              throw "SignTool rejected the installed Vincent executable."
          }
          $updateRuntimeCandidates = @(
              @("iiUpdateManager.dll", "libiiUpdateManager.dll") |
                  ForEach-Object {
                      @(Get-ChildItem -LiteralPath $administrativeImageDirectory -Filter $_ -Recurse -File)
                  }
          )
          if ($updateRuntimeCandidates.Count -ne 1) {
              throw "The signed MSI must install exactly one iiUpdateManager runtime; found $($updateRuntimeCandidates.Count)."
          }
          $updateRuntime = $updateRuntimeCandidates[0].FullName
          $updateRuntimeSignature = Get-AuthenticodeSignature -LiteralPath $updateRuntime
          if ($updateRuntimeSignature.Status -ne "Valid") {
              throw "The installed iiUpdateManager runtime is not Authenticode-signed: $($updateRuntimeSignature.Status)"
          }
          if ($updateRuntimeSignature.SignerCertificate.Subject -notmatch "SignPath Foundation") {
              throw "The installed iiUpdateManager runtime was not signed by the approved SignPath Foundation identity."
          }
          & $signTool.FullName verify /pa /all /tw /v $updateRuntime
          if ($LASTEXITCODE -ne 0) {
              throw "SignTool rejected the installed iiUpdateManager runtime."
          }

      - name: Upload the single website release file
        if: ${{ inputs.submit-for-signing }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Vincent-website-release
          path: '${{ runner.temp }}/signed/Vincent-*-Windows.msi'
          archive: false
          if-no-files-found: error
          retention-days: 30
